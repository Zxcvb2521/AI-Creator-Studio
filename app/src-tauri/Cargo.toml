[package]
name = "ai-creator-studio"
version = "0.1.0"
description = "AI Creator Studio desktop application"
authors = ["Zxcvb2521"]
edition = "2021"

[lib]
name = "ai_creator_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
